{% extends 'base.html' %}
{% block title %}New team{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <form method="post" class="card card-body" novalidate>
        <h1 class="h3">New team</h1>
        <p class="text-muted">You'll be the team's owner. Add teammates once it exists.</p>
        {% csrf_token %}
        {% include 'core/includes/form_fields.html' %}
        <div><button type="submit" class="btn btn-primary">Create team</button></div>
      </form>
    </div>
  </div>
{% endblock %}
